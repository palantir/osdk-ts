packages:
  - "packages/*"
  - "examples/*"
  - "examples-extra/*"
  - "examples-extra/basic/*"
  - "tests/*"
  - "benchmarks/*/*"
  - "docs"

# WARNING: Changesets does not detect catalog version bumps as changes to
# consuming packages (https://github.com/changesets/changesets/issues/1707).
# When bumping versions here, you must manually create a changeset for each
# package that depends on the bumped catalog entry, or those packages will
# not get a new release.
#
# Do not add dependencies here that contain frequent material runtime changes.
# If a catalog dependency is bumped without a changeset, consuming packages
# will not be released with the new version, and users will silently miss
# runtime changes. Adding dependencies to the catalog should be heavily
# considered and is best suited for internal packages with stable APIs.
catalogs:
  foundry-platform-typescript:
    "@osdk/docs-spec-core": 0.6.0
    "@osdk/docs-spec-sdk": 0.17.0
    "@osdk/foundry": 2.70.0
    "@osdk/foundry.core": 2.70.0
    "@osdk/foundry.datasets": ~2.5.0
    "@osdk/foundry.functions": 2.70.0
    "@osdk/foundry.geo": 2.70.0
    "@osdk/foundry.admin": 2.70.0
    "@osdk/foundry.mediasets": 2.70.0
    "@osdk/foundry.ontologies": 2.70.0
    "@osdk/foundry.thirdpartyapplications": 2.70.0
    "@osdk/internal.foundry.ontologies": 2.70.0
allowBuilds:
    "@parcel/watcher": true
    "less": true
    "@swc/core": true
    "@tailwindcss/oxide": true
    "canvas": true
    "core-js": true
    "core-js-pure": true
    "dprint": true
    "esbuild": true
    "msw": true
    "oxfmt": true
    "oxlint": true
    "oxlint-tsgolint": true
    "unrs-resolver": true
overrides:
    "trim@0.0.1": "0.0.3"
    "cookie@0.6.0": "0.7.2"
    "cookie@0.7.1": "0.7.2"
    "esbuild@^0.23.0": "^0.25.0"
    "esbuild@^0.24.0": "^0.25.0"
    "react-server-dom-webpack": ">=19.2.2"
    "webpackbar": "^7.0.0"
    "@types/react": "^18.3.24"
    "@types/react-dom": "^18.3.7"
    "@cspell/dict-css": "^4.0.18"
    "@cspell/dict-html": "^4.0.12"
    "@cspell/dict-html-symbol-entities": "^4.0.4"