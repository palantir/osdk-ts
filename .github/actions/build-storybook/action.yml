name: Build Storybook
description: Installs workspace dependencies and builds the react-components Storybook.

inputs:
  base-path:
    description: >-
      Value for STORYBOOK_BASE_PATH, the Vite base path of the build. Leave
      unset to keep the default from .storybook/main.ts (/osdk-ts/storybook/).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Build dependencies for Storybook
      shell: bash
      run: pnpm exec turbo transpileBrowser --filter='@osdk/react-components-storybook^...'

    - name: Build Storybook
      shell: bash
      env:
        BASE_PATH: ${{ inputs.base-path }}
      run: |
        # main.ts distinguishes unset from empty, so only export a real value.
        if [ -n "$BASE_PATH" ]; then
          export STORYBOOK_BASE_PATH="$BASE_PATH"
        fi
        pnpm --filter @osdk/react-components-storybook build
