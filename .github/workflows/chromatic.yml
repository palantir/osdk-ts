name: Chromatic

env:
  DO_NOT_TRACK: 1

on:
  push:
    branches: [main]
    paths:
      - 'packages/react-components/**'
      - 'packages/react-components-storybook/**'
      - '.github/workflows/chromatic.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/react-components/**'
      - 'packages/react-components-storybook/**'
      - '.github/workflows/chromatic.yml'

permissions: {}

concurrency:
  group: chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  chromatic:
    name: Run Chromatic
    # Fork PRs cannot read repository secrets.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Chromatic uses git history to find baselines across commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build dependencies for Storybook
        run: pnpm --filter "@osdk/*" transpileBrowser

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /
        run: pnpm --filter @osdk/react-components-storybook build

      - name: Publish to Chromatic
        uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/react-components-storybook
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
